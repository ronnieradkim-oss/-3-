for(const h of homes){h.district=(h.address.match(/서울특별시\s+([^\s]+)/)||[])[1]||'기타';h.coords=saved[h.address]||null;h.failed=false;h.marker=null;h.overlay=null}
const districts=[...new Set(homes.map(h=>h.district))].sort();districts.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;$('district').appendChild(o)});
let map,geocoder,currentOverlay=null,visible=[];
function select(h){if(!h.coords){alert('아직 주소 좌표를 찾지 못했습니다. 상단 진행 상태를 확인해 주세요.');return}const point=new kakao.maps.LatLng(h.coords.y,h.coords.x);map.panTo(point);map.setLevel(5);if(currentOverlay)currentOverlay.setMap(null);const b=document.createElement('div');b.className='bubble';b.innerHTML=`<b>${txt(h.name)}</b><div class="muted">${txt(h.address)}</div><hr style="border:0;border-top:1px solid #edf0f3"><div>💰 월세 <b>${money(h.rent)}</b> · ${txt(h.rentGrade)}등급</div><div>📊 경쟁률 <b>${h.competition===null?'자료 없음':txt(h.competition)+'배'}</b> ${h.competitionGrade==='-'?'':'· '+txt(h.competitionGrade)+'등급'}</div><a target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${encodeURIComponent(h.address)}">카카오맵으로 보기 ↗</a>`;const o=new kakao.maps.CustomOverlay({position:point,content:b,yAnchor:1.15,zIndex:10});o.setMap(map);currentOverlay=o;document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',Number(e.dataset.id)===h.id));if(innerWidth<721)$('sidebar').classList.add('closed')}
function pin(h){if(h.marker||!h.coords)return;const e=document.createElement('div');e.className='pin';e.textContent='⌖';e.title=h.name;e.onclick=()=>select(h);h.marker=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(h.coords.y,h.coords.x),content:e,yAnchor:1,zIndex:1})}
function filtered(){const q=$('search').value.trim().toLowerCase(),d=$('district').value,rg=$('rentGrade').value,cg=$('competitionGrade').value;let ar=homes.filter(h=>(!q||(h.name+' '+h.address).toLowerCase().includes(q))&&(!d||h.district===d)&&(!rg||h.rentGrade===rg)&&(!cg||h.competitionGrade===cg));const s=$('sort').value;ar.sort((a,b)=>s==='cheap'?(a.rent??Infinity)-(b.rent??Infinity):s==='expensive'?(b.rent??-1)-(a.rent??-1):s==='comp'?(a.competition??Infinity)-(b.competition??Infinity):a.name.localeCompare(b.name,'ko'));return ar}
function render(){if(!map)return;visible=filtered();$('total').textContent=homes.length;$('located').textContent=homes.filter(h=>h.coords).length;$('missing').textContent=homes.filter(h=>!h.coords).length;$('count').textContent=`주택 목록 (${visible.length})`;const fragment=document.createDocumentFragment();for(const h of visible){const el=document.createElement('button');el.className='item';el.dataset.id=h.id;el.innerHTML=`<div class="iname">${h.coords?'📍':'⚠️'} ${txt(h.name)}</div><div class="addr">${txt(h.address)}</div><div class="chips"><span class="chip">월세 ${money(h.rent)}</span><span class="chip">경쟁 ${h.competition===null?'-':h.competition+'배'} (${txt(h.competitionGrade)})</span>${!h.coords?'<span class="chip warn">좌표 미확인</span>':''}</div>`;el.onclick=()=>select(h);fragment.appendChild(el)}$('list').replaceChildren(fragment);for(const h of homes){pin(h);if(h.marker)h.marker.setMap(visible.includes(h)?map:null)}}
for(const id of ['search','district','sort','rentGrade','competitionGrade'])$(id).addEventListener(id==='search'?'input':'change',render);$('toggle').onclick=()=>{$('sidebar').classList.toggle('closed');$('toggle').textContent=$('sidebar').classList.contains('closed')?'매물 목록 보기 ▴':'지도 크게 보기 ▾'};$('listhead').onclick=()=>{if(innerWidth<721)$('sidebar').classList.toggle('closed')};
function lookupOne(h){return new Promise(resolve=>{const asks=candidates(h.address);let idx=0;const attempt=()=>{if(idx>=asks.length){h.failed=true;resolve();return}geocoder.addressSearch(asks[idx++],(result,status)=>{if(status===kakao.maps.services.Status.OK&&result?.length){h.coords={x:Number(result[0].x),y:Number(result[0].y)};saved[h.address]=h.coords;try{localStorage.setItem(cacheKey,JSON.stringify(saved))}catch(e){}resolve()}else attempt()})};attempt()})}
let working=false;async function geocode(retry=false){if(working)return;working=true;const pending=homes.filter(h=>!h.coords&&(retry||!h.failed));for(let i=0;i<pending.length;i++){await lookupOne(pending[i]);if(i%3===0||i===pending.length-1)render();$('progress').textContent=`주소 검색 ${i+1}/${pending.length} · 성공 ${homes.filter(h=>h.coords).length}건`;await new Promise(r=>setTimeout(r,220))}working=false;$('progress').textContent=`주소 확인 완료 · ${homes.filter(h=>h.coords).length}/${homes.length}건`;render()}
$('retry').onclick=()=>geocode(true);
function init(){if(!(window.kakao&&kakao.maps&&kakao.maps.services)){$('progress').textContent='카카오 API를 불러오지 못했습니다. 키와 등록 도메인을 확인하세요.';return}map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.5665,126.9780),level:8});geocoder=new kakao.maps.services.Geocoder();render();geocode()}
</script><script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4cc6c0ce010aacb2a608368fa040d4aa&libraries=services&autoload=false" onload="kakao.maps.load(init)" onerror="document.getElementById('progress').textContent='지도 SDK 로딩 실패 · 키/도메인 확인'"></script></body></html>
